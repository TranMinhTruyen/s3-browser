# File này chứa cấu hình của dự án.
# Khi cập nhật `info` hoặc `fileAssociations`, chạy `wails3 task common:update:build-assets` để cập nhật các asset.
# Lưu ý thao tác này sẽ ghi đè mọi thay đổi đã thực hiện trên các asset.
version: '3'

# Các thông tin này được dùng để tạo asset build.
info:
  companyName: "minh-truyen" # The name of the company
  productName: "S3 Browser" # The name of the application
  productIdentifier: "com.minhtruyen.s3browser" # The unique product identifier
  description: "A lightweight S3-compatible bucket browser" # The application description
  copyright: "(c) 2026, minh-truyen" # Copyright text
  comments: "S3Browser" # Comments
  version: "1.1.0-beta.19" # The application version

# Cấu hình chế độ phát triển
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - rust
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# Liên kết loại file
fileAssociations:

# Dữ liệu khác
other:
