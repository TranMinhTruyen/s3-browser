version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - lll
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    lll:
      line-length: 120
      tab-width: 4
    staticcheck:
      # v2 merged gosimple + stylecheck into staticcheck.
      # v1 only ran SA* (staticcheck) and S1* (gosimple), so keep ST*/QF* off.
      checks:
        - all
        - -ST*
        - -QF*
    errcheck:
      exclude-functions:
        - (io.Closer).Close
  exclusions:
    generated: lax
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
    - golines
  settings:
    golines:
      max-len: 120
      tab-len: 4
      reformat-tags: false
  exclusions:
    generated: lax
