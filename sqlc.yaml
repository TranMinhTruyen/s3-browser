version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/pkg/modules/bucket/queries"
    schema: "internal/pkg/db/migrations"
    gen:
      go:
        package: "bucketdb"
        out: "internal/pkg/modules/bucket/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true

  - engine: "sqlite"
    queries: "internal/pkg/modules/handlers/queries"
    schema: "internal/pkg/db/migrations"
    gen:
      go:
        package: "handlersdb"
        out: "internal/pkg/modules/handlers/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true