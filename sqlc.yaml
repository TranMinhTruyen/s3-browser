version: "2"
sql:
  - engine: "sqlite"
    queries:
      - "internal/pkg/db/queries/master"
      - "internal/pkg/db/queries/profiles"
      - "internal/pkg/db/queries/bucket"
    schema: "internal/pkg/db/schemas"
    gen:
      go:
        package: "sqlc"
        out: "internal/pkg/db/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
