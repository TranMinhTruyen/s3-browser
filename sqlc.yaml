version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/modules/profile/queries"
    schema: "internal/pkg/db/schemas"
    gen:
      go:
        package: "sqlc"
        out: "internal/modules/profile/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
  - engine: "sqlite"
    queries: "internal/modules/master/queries"
    schema: "internal/pkg/db/schemas"
    gen:
      go:
        package: "sqlc"
        out: "internal/modules/master/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true