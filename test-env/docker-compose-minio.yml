# MinIO + OpenLDAP for testing the MinIO auth methods of S3Browser (Access key, Anonymous, MinIO STS, LDAP).
# Run in this folder:   docker compose -f docker-compose-minio.yml -p s3b-minio-test up -d
# Remove everything:    docker compose -f docker-compose-minio.yml -p s3b-minio-test down -v
# Accounts and expected results: test-profiles.txt (PHẦN A).

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: s3b-test-minio
    command: server --address :10000 --console-address :10001 /data
    ports:
      - "${MINIO_API_PORT:-10010}:10000" # S3 API, the endpoint used in S3Browser
      - "${MINIO_CONSOLE_PORT:-10011}:10001" # Web console, NOT an S3 endpoint
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: "MinioRoot#2026"
    volumes:
      - minio-data:/data
    healthcheck:
      # mc's default "local" alias points at :9000, so point it at the API port.
      test: ["CMD-SHELL", "MC_HOST_local=http://localhost:10000 mc ready local"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  openldap:
    image: osixia/openldap:1.5.0
    container_name: s3b-test-openldap
    # --copy-service lets the container load the mounted LDIF on its first start.
    command: --copy-service
    ports:
      - "${LDAP_PORT:-10389}:389"
    environment:
      LDAP_ORGANISATION: S3Browser Test
      LDAP_DOMAIN: s3browser.local
      LDAP_ADMIN_PASSWORD: "LdapAdmin#2026"
    volumes:
      - ./ldap/s3browser.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-s3browser.ldif:ro
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    restart: unless-stopped

  # One-shot: enables LDAP on MinIO, attaches policies, creates access keys and anonymous buckets.
  minio-init:
    # The server image already ships mc, so no extra image is needed.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: s3b-test-minio-init
    depends_on:
      minio:
        condition: service_healthy
      openldap:
        condition: service_started
    entrypoint: ["/bin/sh", "/scripts/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: "MinioRoot#2026"
    volumes:
      - ./scripts/minio-init.sh:/scripts/minio-init.sh:ro
    restart: "no"

volumes:
  minio-data:
  ldap-data:
  ldap-config:
