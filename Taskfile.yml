version: '3'

vars:
  APP_NAME: "S3Browser"
  BIN_DIR: "build/bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "bun"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 5174}}'
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  build:portable:
    summary: Builds the Windows portable package (needs WEBVIEW2_DIR=<WebView2 Fixed Version folder>)
    cmds:
      - task: windows:build:portable

  build:debug:
    summary: Builds a debuggable dev binary (no inlining/optimisation, for Delve)
    cmds:
      - task: "{{.GOOS}}:build:debug"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - go tool wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  dev:frontend:
    summary: Runs only the frontend dev server
    cmds:
      - task: common:dev:frontend

  docs:pdf:
    summary: Builds the user guide PDFs (en/vi/ja) from docs/user-guide/<lang>/user-guide.md
    dir: docs
    cmds:
      - bun run build:pdf
